; firmware-motion — RPi4 옆 모션 MCU(ESP32). CoreXY A/B + Z 누름, FIT0482 ×3, JMOD-MOTOR-1(TB6612FNG) ×2.
; **컴파일만 확인, 실물 미검증.** 핀·게인·기한은 전부 include/config.h의 자리표시자다.
; 플랫폼은 firmware/platformio.ini와 같은 고정 버전(pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12, ESP-IDF 5.5.5).
; Windows 주의(docs/devlog_2026-09-28-firmware-build.md): PowerShell에서 실행, PLATFORMIO_CORE_DIR=C:\.platformio,
; 저장소 경로에 한글이 있으면 PLATFORMIO_BUILD_DIR=C:\pio-build\firmware-motion.
[platformio]
default_envs = firebeetle32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = firebeetle32
framework = arduino
monitor_speed = 115200
; 로그 레벨 0 — 코어 로그가 호스트 줄 JSON 사이에 끼어들지 않게 한다(같은 UART0).
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Z 누름 방식(2026-10-05): 기본 Z_MODE_MOTOR, *_solenoid는 -DZ_MODE=Z_MODE_SOLENOID(board_config.h).
; esp32dev는 팀원 보드가 일반 ESP32 DevKit일 때를 대비한 같은 소스 빌드다(핀은 board_config.h 한 곳).
[env:firebeetle32]

[env:firebeetle32_solenoid]
build_flags =
    ${env.build_flags}
    -DZ_MODE=Z_MODE_SOLENOID

[env:esp32dev]
board = esp32dev

[env:esp32dev_solenoid]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DZ_MODE=Z_MODE_SOLENOID
