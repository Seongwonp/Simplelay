; 플랫폼 버전 고정 — 미고정(espressif32)이면 설치 시점마다 Arduino 코어가 달라진다.
; pioarduino 55.03.312-1 = Arduino-ESP32 코어 3.3.12 (ESP-IDF 5.5.5). 공식 레지스트리의
; platformio/espressif32(7.x 포함)는 아직 코어 2.0.17이라 코어 3.x를 쓰려면 이 URL이 필요하다.
; ESP-NOW 송수신 콜백은 #if로 코어 2.x/3.x 둘 다 컴파일된다 — 코어 2.x로 되돌리려면
; 아래 줄을 `platform = espressif32@7.0.1`로 바꾼다(2026-09-28 두 쪽 모두 빌드 확인).
; Windows 주의: Git Bash(MSYS)에서 돌리면 pioarduino 설치 단계가 거부된다 — PowerShell에서
; 실행. 경로에 한글이 있으면 링커가 map 파일을 못 연다 — PLATFORMIO_BUILD_DIR를 ASCII
; 경로로 지정. 빌드 기록: docs/devlog_2026-09-28-firmware-build.md
[platformio]
default_envs = firebeetle32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = firebeetle32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.0

; 기본: 폰 BLE 폴백 브릿지만 (ESP-NOW 게이트웨이 꺼짐)
[env:firebeetle32]

; BLE 브릿지 + ESP-NOW 게이트웨이 겸용 (본선 데모 경로)
[env:firebeetle32_espnow]
build_flags =
    ${env.build_flags}
    -D ESPNOW_GATEWAY_ENABLED=1
