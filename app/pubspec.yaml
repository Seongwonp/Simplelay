name: simplelay
description: SimpleLay appliance control companion app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  routine_rehearsal:
    path: ../packages/routine_rehearsal
  appliance_artwork:
    path: ../packages/appliance_artwork
  flutter:
    sdk: flutter
  # 화면 낭독(TalkBack)이 '뒤로'·'삭제'·'닫기' 같은 기본 버튼 이름을 한국어로 읽게(SDK 동봉, 검토 10/19)
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  speech_to_text: ^7.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  fl_chart: ^0.69.0
  http: ^1.2.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  multicast_dns: ^0.3.2
  flutter_tts: ^4.2.0
  # 설정 → 허브 → "현재 위치로 설정"(날씨 예보 격자용 대략 위치, 2026-09-30)
  geolocator: ^14.0.2
  # 폰 연결 화면 안에서 본체 QR을 바로 찍는다. 7.x의 Android 기본 빌드는 인식 모델을 앱에 포함해 인터넷 없이 읽는다.
  mobile_scanner: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
