<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">부착형 누름 장치 개념 (설계도 · 실물 미완성)</text>
  <text x="30" y="54" font-size="13" fill="#4b5563">가전은 그대로 두고 조작부 앞에 CoreXY 갠트리를 붙여 등록한 버튼을 누른다. 치수·누름 깊이는 실측 전.</text>

  <!-- appliance panel -->
  <rect x="40" y="90" width="400" height="300" rx="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="240" y="118" font-size="13" fill="#4b5563" text-anchor="middle">기존 가전 조작부 (예: 전자레인지)</text>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.5">
    <rect x="110" y="150" width="90" height="56" rx="8"/>
    <rect x="280" y="150" width="90" height="56" rx="8"/>
    <rect x="110" y="250" width="90" height="56" rx="8"/>
    <rect x="280" y="250" width="90" height="56" rx="8"/>
  </g>
  <text x="155" y="184" font-size="14" fill="#111827" text-anchor="middle">즉석밥</text>
  <text x="325" y="184" font-size="14" fill="#111827" text-anchor="middle">취소</text>
  <text x="155" y="284" font-size="14" fill="#111827" text-anchor="middle">시작</text>
  <text x="325" y="284" font-size="14" fill="#111827" text-anchor="middle">…</text>

  <!-- gantry overlay -->
  <rect x="70" y="135" width="340" height="190" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="70" y1="230" x2="410" y2="230" stroke="#b45309" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="240" y1="135" x2="240" y2="325" stroke="#b45309" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="240" cy="178" r="16" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
  <line x1="224" y1="178" x2="204" y2="178" stroke="#b45309" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="240" y="183" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">Z</text>
  <text x="70" y="350" font-size="12" fill="#92400e">CoreXY 프레임 (FIT0482 ×2, 벨트) · 갠트리 조립 중</text>
  <text x="70" y="370" font-size="12" fill="#92400e">Z 누름: 스위치봇 모듈 또는 솔레노이드 (미정)</text>

  <!-- flow -->
  <g font-size="13">
    <rect x="510" y="90" width="450" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="528" y="114" font-weight="700" fill="#1b5e20">1. 등록</text>
    <text x="528" y="134" font-size="12" fill="#1f2937">사진 → 모서리 4점 → 버튼 이름·위치 → 정지 버튼 → 확인 주행(모의)</text>

    <rect x="510" y="166" width="450" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="528" y="190" font-weight="700" fill="#1b5e20">2. 승인</text>
    <text x="528" y="210" font-size="12" fill="#1f2937">루틴 호출·제안 → 승인 카드(누를 순서 표시) → 사용자가 '시작'</text>

    <rect x="510" y="242" width="450" height="56" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="528" y="266" font-weight="700" fill="#92400e">3. 누름</text>
    <text x="528" y="286" font-size="12" fill="#1f2937">RPi4 → 모션 MCU(미정) → 버튼 위치 이동·Z 누름 — 현재 모의</text>

    <rect x="510" y="318" width="450" height="72" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="528" y="342" font-weight="700" fill="#92400e">4. 확인</text>
    <text x="528" y="362" font-size="12" fill="#1f2937">L1 눌림(전류) · L2 입력 수용(비프음) · L3 동작(CT 전력)</text>
    <text x="528" y="380" font-size="12" fill="#1f2937">실패 시 보정 재시도 또는 안전 정지 — 판정은 모의 입력 시험</text>
  </g>
  <line x1="735" y1="146" x2="735" y2="164" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="735" y1="222" x2="735" y2="240" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="735" y1="298" x2="735" y2="316" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <path d="M510,270 L440,230" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <text x="30" y="440" font-size="11" fill="#4b5563">초록 = 소프트웨어로 동작(모의 실행 포함) · 주황 점선 = 설계·실물 미연결. 다이얼식 조작부는 지원하지 않는다.</text>
</svg>
