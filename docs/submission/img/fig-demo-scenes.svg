<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">시연 v3 "한 사람의 하루" — 6분 6장면과 검증 수준</text>
  <text x="30" y="54" font-size="13" fill="#4b5563">도입 20초 → ①~⑥ 5분 20초 → 마무리 20초 · 아래 '현재 수준'은 2026-10-06 기준이며 실물 등급은 런북 조건 충족 시에만 올린다</text>

  <!-- legend -->
  <rect x="30" y="70" width="18" height="14" rx="3" fill="#fde68a" stroke="#b45309"/>
  <text x="54" y="82" font-size="12" fill="#1f2937">모의(시뮬레이터·모의 실행기)</text>
  <rect x="250" y="70" width="18" height="14" rx="3" fill="#fecaca" stroke="#b91c1c"/>
  <text x="274" y="82" font-size="12" fill="#1f2937">시연 주입(무대에서 항상 표시)</text>
  <rect x="470" y="70" width="18" height="14" rx="3" fill="#e5e7eb" stroke="#4b5563"/>
  <text x="494" y="82" font-size="12" fill="#1f2937">화면·서버 흐름(장치 동작 없음)</text>

  <!-- row 1 -->
  <g>
    <rect x="30" y="100" width="300" height="240" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="48" y="130" font-size="17" font-weight="700" fill="#111827">① 아침 데우기 · 70초</text>
    <text x="48" y="156" font-size="12" fill="#1f2937">루틴 호출 → 승인 카드 → 전자레인지</text>
    <text x="48" y="174" font-size="12" fill="#1f2937">즉석밥 → 시작 → 시작 확인 뒤</text>
    <text x="48" y="192" font-size="12" fill="#1f2937">복약 시간 안내(의료 판단 아님)</text>
    <rect x="48" y="210" width="264" height="26" rx="6" fill="#fde68a" stroke="#b45309"/>
    <text x="58" y="228" font-size="12" font-weight="700" fill="#78350f">현재: 모의 누름 · "시연 통과"</text>
    <text x="48" y="260" font-size="11" fill="#4b5563">실물 목표: 갠트리 1대로 누름</text>
    <text x="48" y="278" font-size="11" fill="#4b5563">햇반 실제 가열은 런북 §3-7 체크리스트</text>
    <text x="48" y="294" font-size="11" fill="#4b5563">전부 통과 시에만. 가열 종료 확인 아님</text>
  </g>
  <g>
    <rect x="350" y="100" width="300" height="240" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="368" y="130" font-size="17" font-weight="700" fill="#111827">② 외출 전 세탁 · 70초</text>
    <text x="368" y="156" font-size="12" fill="#1f2937">세탁기 전원 → 표준 → 시작</text>
    <text x="368" y="174" font-size="12" fill="#1f2937">첫 버튼 확인 실패를 일부러 주입</text>
    <text x="368" y="192" font-size="12" fill="#1f2937">→ 보정 재시도 1회</text>
    <rect x="368" y="210" width="264" height="26" rx="6" fill="#fde68a" stroke="#b45309"/>
    <text x="378" y="228" font-size="12" font-weight="700" fill="#78350f">현재: 모의 누름 + 실패 주입</text>
    <text x="368" y="260" font-size="11" fill="#4b5563">실제 센서 실패 사례가 아니다</text>
    <text x="368" y="278" font-size="11" fill="#4b5563">시작 확인은 실행기 보고 수준</text>
    <text x="368" y="294" font-size="11" fill="#4b5563">세탁기 조작부 모형·누름 배치 미정</text>
  </g>
  <g>
    <rect x="670" y="100" width="300" height="240" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
    <text x="688" y="130" font-size="17" font-weight="700" fill="#111827">③ 낮의 인터폰 · 50초</text>
    <text x="688" y="156" font-size="12" fill="#1f2937">사람이 문 열기 루틴을 호출하고</text>
    <text x="688" y="174" font-size="12" fill="#1f2937">승인 → 문열림 버튼 누름</text>
    <rect x="688" y="210" width="264" height="26" rx="6" fill="#fde68a" stroke="#b45309"/>
    <text x="698" y="228" font-size="12" font-weight="700" fill="#78350f">현재: 모의 누름 · 확인 근거 '보고'</text>
    <text x="688" y="260" font-size="11" fill="#4b5563">호출 자동 감지 없음</text>
    <text x="688" y="278" font-size="11" fill="#4b5563">실제 문 열림은 확인하지 않는다</text>
    <text x="688" y="294" font-size="11" fill="#4b5563">인터폰 조작부 모형·누름 배치 미정</text>
  </g>

  <!-- row 2 -->
  <g>
    <rect x="30" y="360" width="300" height="240" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="48" y="390" font-size="17" font-weight="700" fill="#111827">④ 귀가·세탁 완료 · 40초</text>
    <text x="48" y="416" font-size="12" fill="#1f2937">CT 전력 하강 + 종료음이 함께 맞으면</text>
    <text x="48" y="434" font-size="12" fill="#1f2937">"세탁이 끝났어요", 하나뿐이면</text>
    <text x="48" y="452" font-size="12" fill="#1f2937">"확인해 주세요"로 낮춰 안내</text>
    <rect x="48" y="470" width="264" height="26" rx="6" fill="#fecaca" stroke="#b91c1c"/>
    <text x="58" y="488" font-size="12" font-weight="700" fill="#7f1d1d">모든 등급: "(시연 주입)" 표시</text>
    <text x="48" y="520" font-size="11" fill="#4b5563">무대 세탁기는 돌리지 않는다</text>
    <text x="48" y="538" font-size="11" fill="#4b5563">판정은 합성 입력 시험까지</text>
    <text x="48" y="554" font-size="11" fill="#4b5563">실제 세탁기 기준값은 실측 전</text>
  </g>
  <g>
    <rect x="350" y="360" width="300" height="240" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="368" y="390" font-size="17" font-weight="700" fill="#111827">⑤ 비상정지 · 60초</text>
    <text x="368" y="416" font-size="12" fill="#1f2937">래치 → 새 실행 차단 → 버튼 해제</text>
    <text x="368" y="434" font-size="12" fill="#1f2937">→ 사람 확인(POST /stop/ack)</text>
    <text x="368" y="452" font-size="12" fill="#1f2937">폰 배너·키오스크 띠 표시</text>
    <rect x="368" y="470" width="264" height="26" rx="6" fill="#fecaca" stroke="#b91c1c"/>
    <text x="378" y="488" font-size="12" font-weight="700" fill="#7f1d1d">현재: 모의 래치(리허설 주입)</text>
    <text x="368" y="520" font-size="11" fill="#4b5563">콘센트 모듈 회로 미조립</text>
    <text x="368" y="538" font-size="11" fill="#4b5563">펌웨어는 컴파일까지</text>
    <text x="368" y="554" font-size="11" fill="#4b5563">물리 정지 확인 없음</text>
  </g>
  <g>
    <rect x="670" y="360" width="300" height="240" rx="12" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
    <text x="688" y="390" font-size="17" font-weight="700" fill="#111827">⑥ 사용자 통제 · 30초</text>
    <text x="688" y="416" font-size="12" fill="#1f2937">'다음에'로 제안 넘기기</text>
    <text x="688" y="434" font-size="12" fill="#1f2937">수동 부재 입력 → 카드 철회</text>
    <rect x="688" y="470" width="264" height="26" rx="6" fill="#e5e7eb" stroke="#4b5563"/>
    <text x="698" y="488" font-size="12" font-weight="700" fill="#1f2937">현재: 화면·서버 흐름</text>
    <text x="688" y="520" font-size="11" fill="#4b5563">시스템 철회를 사용자 거절로</text>
    <text x="688" y="538" font-size="11" fill="#4b5563">학습하지 않는다</text>
    <text x="688" y="554" font-size="11" fill="#4b5563">접근 감지 장치 없음(재실은 수동)</text>
  </g>

  <text x="30" y="626" font-size="11" fill="#4b5563">무대 배치: 15.8형 키오스크(카드·동작 중·비상 띠) + 보조 화면(폰 미러링, 전부 모의 등급이면 디지털 트윈). 모터·센서 실물 검증 0건.</text>
</svg>
