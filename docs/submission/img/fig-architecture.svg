<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <title>SimpleLay 구성도 (2026-10-18)</title>
  <desc>폰 앱, RPi5 본체(백엔드·터치 화면), RPi4 실행기, ESP32 모션(작은 팔), ESP32 콘센트 모듈, 전자레인지, LG 가전 클라우드와 공기청정기, 기상청 날씨 사이에 오가는 것을 보인다. 선 색·모양은 검증 수준을 뜻하지 않는다.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="810" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="24" y="38" font-size="22" font-weight="700" fill="#111827">SimpleLay 구성도 — 보드 역할과 오가는 것 (2026-10-18)</text>
  <text x="24" y="64" font-size="14" fill="#1f2937">폰이나 본체 화면에서 승인하면 본체가 실행기에 명령을 보내고, 작은 팔이 버튼을 누른다. LG 공기청정기는 클라우드로 직접 제어한다.</text>

  <!-- 폰 앱 -->
  <rect x="24" y="110" width="190" height="150" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="119" y="142" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">폰 앱</text>
  <text x="119" y="166" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">관리용</text>
  <text x="119" y="192" font-size="14" fill="#1f2937" text-anchor="middle">가전 등록·루틴</text>
  <text x="119" y="214" font-size="14" fill="#1f2937" text-anchor="middle">제안 승인·기록</text>
  <text x="119" y="236" font-size="14" fill="#1f2937" text-anchor="middle">정지 버튼</text>

  <!-- RPi5 본체 -->
  <rect x="372" y="90" width="400" height="250" rx="12" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
  <text x="572" y="120" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">RPi5 본체</text>
  <text x="572" y="143" font-size="14" fill="#1f2937" text-anchor="middle">제안·승인 대조·기록 — 모든 실행은 여기를 거친다</text>
  <rect x="390" y="158" width="175" height="164" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="477" y="184" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">백엔드</text>
  <text x="477" y="210" font-size="14" fill="#1f2937" text-anchor="middle">승인한 명령과</text>
  <text x="477" y="230" font-size="14" fill="#1f2937" text-anchor="middle">같은지 대조</text>
  <text x="477" y="256" font-size="14" fill="#1f2937" text-anchor="middle">루틴·제안·기록</text>
  <text x="477" y="280" font-size="14" fill="#1f2937" text-anchor="middle">정지 요청 우선</text>
  <text x="477" y="304" font-size="14" fill="#1f2937" text-anchor="middle">자동 실행 규칙</text>
  <rect x="580" y="158" width="175" height="164" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="667" y="184" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">터치 화면</text>
  <text x="667" y="210" font-size="14" fill="#1f2937" text-anchor="middle">15.8형 키오스크</text>
  <text x="667" y="236" font-size="14" fill="#1f2937" text-anchor="middle">제안 카드·승인</text>
  <text x="667" y="260" font-size="14" fill="#1f2937" text-anchor="middle">실행 중 상태</text>
  <text x="667" y="284" font-size="14" fill="#1f2937" text-anchor="middle">큰 정지 버튼</text>

  <!-- 오른쪽: 인터넷 서비스 -->
  <rect x="880" y="90" width="216" height="80" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="988" y="122" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">기상청 날씨</text>
  <text x="988" y="148" font-size="14" fill="#1f2937" text-anchor="middle">인터넷 공공 날씨</text>

  <rect x="880" y="200" width="216" height="100" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="988" y="230" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">LG 가전 클라우드</text>
  <text x="988" y="255" font-size="14" fill="#1f2937" text-anchor="middle">공식 연동 · 계정은</text>
  <text x="988" y="277" font-size="14" fill="#1f2937" text-anchor="middle">설치 때 한 번 연결</text>

  <rect x="880" y="400" width="216" height="100" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="988" y="430" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">LG 공기청정기</text>
  <text x="988" y="455" font-size="14" fill="#1f2937" text-anchor="middle">클라우드로 직접 제어</text>
  <text x="988" y="477" font-size="14" fill="#1f2937" text-anchor="middle">(작은 팔 필요 없음)</text>

  <!-- RPi4 실행기 -->
  <rect x="372" y="400" width="400" height="120" rx="12" fill="#e5e7eb" stroke="#111827" stroke-width="3"/>
  <text x="572" y="432" font-size="20" font-weight="700" fill="#111827" text-anchor="middle">RPi4 실행기</text>
  <text x="572" y="458" font-size="14" fill="#1f2937" text-anchor="middle">누름 순서 실행 · 정지 · 결과 확인</text>
  <text x="572" y="482" font-size="14" fill="#1f2937" text-anchor="middle">본체와 Wi-Fi 연결, 페어링 키로 인증</text>
  <text x="572" y="504" font-size="13" fill="#374151" text-anchor="middle">누른 뒤 콘센트 전력으로 가전 동작 확인</text>

  <!-- 아래: 장치와 가전 -->
  <rect x="24" y="600" width="330" height="130" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="189" y="630" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">ESP32 모션 = 작은 팔</text>
  <text x="189" y="656" font-size="14" fill="#1f2937" text-anchor="middle">CoreXY 갠트리, 엔코더 모터 2개</text>
  <text x="189" y="680" font-size="14" fill="#1f2937" text-anchor="middle">+ 솔레노이드로 버튼 누름</text>
  <text x="189" y="704" font-size="14" fill="#1f2937" text-anchor="middle">걸림 감지 · 멈춤 확인</text>

  <rect x="430" y="600" width="260" height="130" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <text x="560" y="630" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">전자레인지</text>
  <text x="560" y="654" font-size="14" fill="#1f2937" text-anchor="middle">쓰던 가전 그대로</text>
  <text x="560" y="678" font-size="14" fill="#1f2937" text-anchor="middle">버튼판: 30초 → 시작</text>
  <text x="560" y="702" font-size="14" fill="#1f2937" text-anchor="middle">전원선이 콘센트 모듈을 지남</text>

  <rect x="766" y="600" width="330" height="130" rx="10" fill="#f3f4f6" stroke="#111827" stroke-width="2.5"/>
  <text x="931" y="630" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">ESP32 콘센트 모듈</text>
  <text x="931" y="656" font-size="14" fill="#1f2937" text-anchor="middle">CT 전력으로 가열 시작·종료 감지</text>
  <text x="931" y="680" font-size="14" fill="#1f2937" text-anchor="middle">릴레이(가전 전원)</text>
  <text x="931" y="704" font-size="14" fill="#1f2937" text-anchor="middle">비상정지 버튼 · 래치</text>

  <!-- 화살표: 폰 ↔ 본체 -->
  <line x1="214" y1="180" x2="370" y2="180" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="293" y="170" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">승인·실행 요청</text>
  <line x1="372" y1="228" x2="216" y2="228" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="293" y="218" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">결과·기록</text>

  <!-- 본체 ↔ 날씨·클라우드 -->
  <line x1="772" y1="130" x2="878" y2="130" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="826" y="120" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">날씨 조회</text>
  <line x1="772" y1="236" x2="878" y2="236" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="826" y="226" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">제어 요청</text>
  <line x1="880" y1="280" x2="774" y2="280" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="826" y="270" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">상태 확인</text>

  <!-- 클라우드 ↔ 공기청정기 -->
  <line x1="988" y1="300" x2="988" y2="398" stroke="#111827" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="978" y="345" font-size="14" font-weight="700" fill="#111827" text-anchor="end">켜기·바람 세기</text>
  <text x="978" y="365" font-size="14" font-weight="700" fill="#111827" text-anchor="end">/ 현재 상태</text>

  <!-- 본체 ↔ 실행기 -->
  <line x1="520" y1="340" x2="520" y2="398" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="510" y="375" font-size="14" font-weight="700" fill="#111827" text-anchor="end">실행 명령 · 정지</text>
  <line x1="630" y1="400" x2="630" y2="342" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="375" font-size="14" font-weight="700" fill="#111827">결과 · 정지 보고</text>

  <!-- 실행기 ↔ 작은 팔 -->
  <line x1="420" y1="520" x2="252" y2="598" stroke="#111827" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="290" y="546" font-size="14" font-weight="700" fill="#111827" text-anchor="end">이동·누름 명령 (USB)</text>
  <text x="290" y="566" font-size="14" fill="#1f2937" text-anchor="end">엔코더 위치·멈춤 확인</text>

  <!-- 실행기 ↔ 콘센트 모듈 -->
  <line x1="724" y1="520" x2="892" y2="598" stroke="#111827" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="854" y="546" font-size="14" font-weight="700" fill="#111827">전력 측정값 (USB)</text>
  <text x="854" y="566" font-size="14" fill="#1f2937">비상정지·릴레이 상태</text>

  <!-- 작은 팔 → 전자레인지 -->
  <line x1="354" y1="660" x2="428" y2="660" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="392" y="650" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">누름</text>

  <!-- 전자레인지 → 콘센트 모듈 (전원선) -->
  <line x1="690" y1="690" x2="764" y2="690" stroke="#111827" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="728" y="680" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">전원선</text>

  <!-- 아래 설명 -->
  <line x1="24" y1="748" x2="1096" y2="748" stroke="#9ca3af" stroke-width="1"/>
  <text x="24" y="772" font-size="15" font-weight="700" fill="#111827">선 색·모양은 검증 수준을 뜻하지 않는다. 실물로 확인한 범위는 본문 검증 표가 말한다.</text>
  <text x="24" y="796" font-size="13" fill="#374151">작은 팔 = 갠트리(CoreXY)와 솔레노이드. CT = 전원선에 거는 전류 센서. 정지는 폰·터치 화면·음성 "멈춰", 콘센트 모듈 비상정지 버튼(설계)에서 건다.</text>
</svg>
