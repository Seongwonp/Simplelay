<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="700" fill="#111827">비상정지와 복구 흐름</text>
  <text x="30" y="54" font-size="13" fill="#4b5563">펌웨어는 컴파일까지, 래치·확인 해제는 가짜 모듈·시뮬레이터 시험까지 확인. 차단 회로 미조립.</text>

  <!-- step 1 -->
  <rect x="30" y="80" width="215" height="200" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="58" cy="108" r="16" fill="#b91c1c"/>
  <text x="58" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="84" y="114" font-size="16" font-weight="700" fill="#991b1b">비상정지 발생</text>
  <text x="44" y="146" font-size="12" fill="#1f2937">콘센트 모듈 버튼 눌림</text>
  <text x="44" y="166" font-size="12" fill="#1f2937">→ 호스트 응답 없이</text>
  <text x="44" y="186" font-size="12" fill="#1f2937">   릴레이 개방(설계)</text>
  <text x="44" y="206" font-size="12" fill="#1f2937">→ 래치 보존</text>
  <text x="44" y="236" font-size="11" fill="#b45309">리허설: 시연 주입으로</text>
  <text x="44" y="252" font-size="11" fill="#b45309">모의 래치 생성</text>
  <text x="44" y="268" font-size="11" fill="#b45309">(실제 모듈·릴레이 아님)</text>

  <!-- step 2 -->
  <rect x="275" y="80" width="215" height="200" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
  <circle cx="303" cy="108" r="16" fill="#b45309"/>
  <text x="303" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="329" y="114" font-size="16" font-weight="700" fill="#92400e">실행 차단</text>
  <text x="289" y="146" font-size="12" fill="#1f2937">래치를 RPi4에 전달</text>
  <text x="289" y="166" font-size="12" fill="#1f2937">→ 새 실행 요청 거절</text>
  <text x="289" y="186" font-size="12" fill="#1f2937">→ 폰 배너·키오스크 띠</text>
  <text x="289" y="206" font-size="12" fill="#1f2937">   "비상정지가 걸려 있어요"</text>
  <text x="289" y="236" font-size="11" fill="#4b5563">통신 응답(ACK)과</text>
  <text x="289" y="252" font-size="11" fill="#4b5563">실제 정지는 구분한다</text>

  <!-- step 3 -->
  <rect x="520" y="80" width="215" height="200" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="548" cy="108" r="16" fill="#1d4ed8"/>
  <text x="548" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="574" y="114" font-size="16" font-weight="700" fill="#1e3a8a">버튼 해제</text>
  <text x="534" y="146" font-size="12" fill="#1f2937">사람이 비상 버튼을 푼다</text>
  <text x="534" y="166" font-size="12" fill="#1f2937">래치는 그대로 유지</text>
  <text x="534" y="196" font-size="12" fill="#1f2937">버튼이 눌린 상태에서는</text>
  <text x="534" y="216" font-size="12" fill="#1f2937">해제 요청을 거절</text>

  <!-- step 4 -->
  <rect x="765" y="80" width="205" height="200" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="793" cy="108" r="16" fill="#2e7d32"/>
  <text x="793" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="819" y="114" font-size="16" font-weight="700" fill="#1b5e20">사람 확인</text>
  <text x="779" y="146" font-size="12" fill="#1f2937">"확인하고 해제"</text>
  <text x="779" y="166" font-size="12" fill="#1f2937">→ POST /stop/ack</text>
  <text x="779" y="186" font-size="12" fill="#1f2937">→ 래치 해제</text>
  <text x="779" y="216" font-size="11" fill="#4b5563">래치 해제만으로 릴레이</text>
  <text x="779" y="232" font-size="11" fill="#4b5563">복전을 가정하지 않는다.</text>
  <text x="779" y="248" font-size="11" fill="#4b5563">복전 절차는 회로 조립 후</text>
  <text x="779" y="264" font-size="11" fill="#4b5563">런북에서 검증</text>

  <line x1="245" y1="180" x2="273" y2="180" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="490" y1="180" x2="518" y2="180" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="735" y1="180" x2="763" y2="180" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- notes -->
  <rect x="30" y="305" width="940" height="100" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="46" y="330" font-size="12" font-weight="700" fill="#111827">별개 경로</text>
  <text x="46" y="352" font-size="12" fill="#1f2937">· 화면 정지: 폰·키오스크의 정지 → POST /stop. "정지를 요청했어요. 장치를 확인해 주세요" — 물리 정지 확인(엔코더 속도 0)은 없다.</text>
  <text x="46" y="374" font-size="12" fill="#1f2937">· 콘센트 릴레이는 전자레인지 전원을 끊는다. 갠트리가 계속 움직일 때의 마지막 수단은 별도 모터 전원 스위치다.</text>
  <text x="46" y="396" font-size="12" fill="#1f2937">· 버튼 → 릴레이 차단 지연, 실제 모터 정지 시간은 【실측 후 기입】.</text>
</svg>
