; firmware-motion-corexy — RPi4 옆 모션 MCU(ESP32 DevKit). CoreXY A/B(FIT0482 ×2, TB6612) + 선택형 Z 누름.
; 원작: 팀원(서예솔) Touch Bridge CoreXY 펌웨어 v3(Arduino IDE 스케치), SimpleLay용으로 통신·이름 수정(2026-10-10).
; **컴파일만 확인, 실물 미검증.** 기구·게인 값은 include/config.h에서 전부 실측 필요.
; 플랫폼은 firmware-motion·firmware-outlet과 같은 고정 버전(pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12).
; Windows: PowerShell에서, 짧은 코어 경로(PLATFORMIO_CORE_DIR=C:\pio)와 ASCII 빌드 폴더로 — README 참고.
[platformio]
default_envs = esp32dev

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; CH340 USB-시리얼 보드는 고속 업로드(460800·921600)에서 "Serial data stream stopped"로 실패했다(2026-10-12).
upload_speed = 115200
; 로그 레벨 0 — 코어 로그가 호스트 줄 JSON 사이에 끼어들지 않게 한다(같은 UART0).
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; 시연·RPi4 연결용(줄 단위 JSON만).
[env:esp32dev]

; SwitchBot Bot BLE 누름 선택 빌드. BLE 클라이언트만 쓰며 앱용 BLE 서버는 만들지 않는다.
[env:esp32dev_switchbot]
board_build.partitions = huge_app.csv
build_flags =
    ${env.build_flags}
    -DZ_ACTUATOR_SWITCHBOT=1
    -DSWITCHBOT_MAC=\"f5:2a:43:db:ea:28\"

; 첫 시험(방향·부호 확인) 전용 — 사람용 M·Z·G·T·H·S·P·K 명령이 켜진다. 시연 보드에 올리지 않는다.
[env:esp32dev_bringup]
build_flags =
    ${env.build_flags}
    -DBRINGUP_TEXT_COMMANDS=1

; 시험대 전용 — home이 움직이지 않고 현재 위치를 원점으로 삼는다(벨트·풀리 미완성 기구에서 RPi 경로 확인용).
; 배너 fw = firmware-motion-corexy-benchhome. 시연 보드에 올리지 않는다.
[env:esp32dev_benchhome]
build_flags =
    ${env.build_flags}
    -DBENCH_HOME_AT_CURRENT=1
