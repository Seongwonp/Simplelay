[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplelay-rpi"
version = "0.1.0"
description = "Hardware-independent SimpleLay Raspberry Pi closed-loop layer"
requires-python = ">=3.11"

[project.dependencies]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
# RPi5 실기기 전용 — 개발 PC에서는 설치 불필요
# setup_rpi.sh에서 pip install -e ".[gpio]" 로 설치
gpio = [
    "adafruit-blinka>=8,<9",
    "adafruit-circuitpython-dht>=3.7",
    "gpiozero>=2",
    "lgpio>=0.2",
    # ESP-NOW 게이트웨이(UART로 붙은 ESP32)와 통신 — SIMPLELAY_NODE_TRANSPORT=espnow
    "pyserial>=3.5",
]

[tool.poetry]
packages = [{include = "rpi"}, {include = "rpi4"}]

[tool.pytest.ini_options]
testpaths = ["rpi/tests", "rpi4/tests"]
pythonpath = ["."]
