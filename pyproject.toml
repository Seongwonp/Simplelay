[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplelay-rpi"
version = "0.1.0"
description = "Hardware-independent SimpleLay Raspberry Pi closed-loop layer"
requires-python = ">=3.11"
# 주의: 이 배열은 [project] 안에 있어야 한다. [project.dependencies] 테이블로
# 감싸면 setuptools가 "must be array"로 거절해 pip install -e . 자체가 실패한다
# (scripts/setup_rpi.sh가 그 명령으로 기기를 세팅한다).
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
    "numpy>=1.26,<3",
    # ESP 노드 HTTP 전송(esp_node_controller)에서 최상위 import — 런타임 필수.
    "httpx>=0.27,<1",
    "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
# dbus-fast는 실기기 전용(dbus extra)이지만 테스트에도 넣는다: 온디바이스
# D-Bus 인코딩 테스트가 실제 Variant 타입으로 검증하기 때문이다. 빼면
# 개발 PC의 깨끗한 venv에서 그 테스트만 조용히 실패한다.
# matplotlib은 scripts/plots/(실측 그래프 4종, 2026-10-10)용이다. 기기 실행 경로에는 필요 없다.
# 없는 환경에서는 그림 그리기 시험만 건너뛰고 입력 검사 시험은 돈다.
test = ["pytest>=8,<10", "dbus-fast>=2,<3", "matplotlib>=3.8,<4"]
# RPi5 실기기 전용 — 개발 PC에서는 설치 불필요
# setup_rpi.sh에서 pip install -e ".[gpio]" 로 설치
gpio = [
    "adafruit-blinka>=8,<9",
    "adafruit-circuitpython-dht>=3.7",
    "gpiozero>=2",
    "lgpio>=0.2",
    # ESP-NOW 게이트웨이(UART로 붙은 ESP32)와 통신 — SIMPLELAY_NODE_TRANSPORT=espnow
    "pyserial>=3.5",
]
# 온디바이스 D-Bus를 파이썬에서 직접 호출 — SIMPLELAY_LLM_MODE=dbus + SIMPLELAY_DBUS_TRANSPORT=native.
# 플랫폼 컨테이너에는 D-Bus CLI가 없어 이 경로로 시스템 버스에 직접 붙는다.
# Windows dev에서도 import·로직 검증은 되지만 실제 연결은 리눅스 시스템 버스에서만.
dbus = [
    "dbus-fast>=2,<3",
]

# 빌드 백엔드는 setuptools다(위 [build-system]). 리포 루트에 app/·docs/ 등
# 파이썬이 아닌 최상위 디렉터리가 많아 자동 탐색이 실패하므로 범위를 못 박는다.
[tool.setuptools.packages.find]
include = ["rpi*", "rpi4*"]

[tool.pytest.ini_options]
testpaths = ["rpi/tests", "rpi4/tests"]
pythonpath = ["."]
