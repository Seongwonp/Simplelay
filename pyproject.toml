[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplelay-rpi"
version = "0.1.0"
description = "Hardware-independent SimpleLay Raspberry Pi closed-loop layer"
requires-python = ">=3.11"

[project.dependencies]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.poetry]
packages = [{include = "rpi"}]

[tool.pytest.ini_options]
testpaths = ["rpi/tests"]
pythonpath = ["."]
