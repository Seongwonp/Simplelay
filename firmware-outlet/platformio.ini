; firmware-outlet — ESP32 콘센트 모듈. CT 비접촉 전력 계측 → RPi4(USB 시리얼, 줄 단위 JSON),
; 물리 비상정지 버튼 + 가전 전원 차단 릴레이. **컴파일만 확인, 실물 미검증.**
; 핀·CT 보정·릴레이 극성은 전부 include/config.h의 자리표시자다(측정 필요).
; 플랫폼은 firmware-motion/platformio.ini와 같은 고정 버전(pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12, ESP-IDF 5.5.5).
; Windows 주의(docs/devlog_2026-09-28-firmware-build.md): PowerShell에서 실행, 저장소 경로에 한글이 있으면
; PLATFORMIO_BUILD_DIR=C:\pio-build\firmware-outlet.
;
; CT 입력 두 가지(빌드 플래그 OUTLET_CT_SOURCE):
;   firebeetle32      — ADS1115(I2C, 차동 AIN0-AIN1). 9/30 센서 권장안(SCT-013-030 + ADS1115).
;   firebeetle32_adc  — ESP32 내장 ADC1(GPIO36·GPIO39) 직결. 외부 ADC 없이 시험할 때. 잡음·비선형이 커서 보정 필요.
; CT 채널 수(빌드 플래그 OUTLET_CT_CHANNELS, 2026-10-06 두 번째 CT): 기본 2(ch0 전자레인지·ch1 세탁기).
;   firebeetle32_1ct  — ADS1115, CT 하나(채널 0만). 두 번째 CT 없이 조립했을 때.
[platformio]
default_envs = firebeetle32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = firebeetle32
framework = arduino
monitor_speed = 115200
; 로그 레벨 0 — 코어 로그가 호스트 줄 JSON 사이에 끼어들지 않게 한다(같은 UART0).
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

[env:firebeetle32]
build_flags =
    ${env.build_flags}
    -DOUTLET_CT_SOURCE=1

[env:firebeetle32_adc]
build_flags =
    ${env.build_flags}
    -DOUTLET_CT_SOURCE=2

[env:firebeetle32_1ct]
build_flags =
    ${env.build_flags}
    -DOUTLET_CT_SOURCE=1
    -DOUTLET_CT_CHANNELS=1
