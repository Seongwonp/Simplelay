; 플랫폼 버전 고정 — 미고정(espressif32)이면 설치 시점마다 Arduino 코어가 달라진다.
; pioarduino 55.03.312-1 = Arduino-ESP32 코어 3.3.12 (ESP-IDF 5.5.5). 공식 레지스트리의
; platformio/espressif32(7.x 포함)는 아직 코어 2.0.17이라 코어 3.x를 쓰려면 이 URL이 필요하다.
; ESP-NOW 송수신 콜백은 #if로 코어 2.x/3.x 둘 다 컴파일된다 — 코어 2.x로 되돌리려면
; 아래 줄을 `platform = espressif32@7.0.1`로 바꾼다(2026-09-28 두 쪽 모두 빌드 확인).
; Windows 주의: Git Bash(MSYS)에서 돌리면 pioarduino 설치 단계가 거부된다 — PowerShell에서
; 실행. 경로에 한글이 있으면 링커가 map 파일을 못 연다 — PLATFORMIO_BUILD_DIR를 ASCII
; 경로로 지정. 빌드 기록: docs/devlog/devlog_2026-09-28-firmware-build.md
;
; Wi-Fi SSID/비밀번호와 게이트웨이 MAC은 소스에 적지 않는다.
; secrets.ini.example을 secrets.ini로 복사해 채운다(secrets.ini는 git 추적 안 함).
; secrets.ini가 없으면 config.h의 자리표시자(CHANGE_ME, MAC 0)로 컴파일만 된다.
[platformio]
default_envs = firebeetle32
extra_configs = secrets.ini

; secrets.ini가 없을 때의 빈 기본값 — secrets.ini의 같은 섹션이 덮어쓴다
[secrets]
build_flags =

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = firebeetle32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ${secrets.build_flags}
lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; 기본: 개발용 HTTP 전송
[env:firebeetle32]

; 본선 데모용 ESP-NOW 전송 (게이트웨이 MAC을 secrets.ini에 넣어야 실제로 통한다)
[env:firebeetle32_espnow]
build_flags =
    ${env.build_flags}
    -D ESPNOW_ENABLED=1
