<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimpleLay 발표자 창</title>
<style>
:root{--bg:#0f1c1a;--panel:#172a27;--ink:#eaf4f2;--sub:#9db5b0;--teal:#2cc3b8;--amber:#f0a73a;--warn:#f06a64;--line:#27403c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:16px;min-height:100%}
.top{display:flex;gap:14px;flex-wrap:wrap}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.box .k{font-size:13px;color:var(--sub)}
.box .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.v.over{color:var(--warn)} .v.ok{color:var(--teal)}
.hubdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--amber);margin-right:8px;vertical-align:middle}
.hubdot.on{background:var(--teal)}
.main{display:grid;grid-template-columns:1fr 300px;gap:14px;min-height:0}
.script{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;overflow:auto}
.script .where{font-size:15px;color:var(--teal);font-weight:700;margin-bottom:6px}
.script h1{font-size:26px;margin-bottom:16px}
.script p{font-size:30px;line-height:1.65}
.script .hint{margin-top:18px;font-size:16px;color:var(--amber)}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.next .k{font-size:13px;color:var(--sub)}
.next .t{font-size:20px;font-weight:700;margin-top:4px}
ol{list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;overflow:auto;flex:1}
ol li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--sub)}
ol li.cur{background:#21403b;color:var(--ink);font-weight:700}
ol li span:last-child{font-variant-numeric:tabular-nums}
ol li.sep{cursor:default;color:var(--amber);font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;border-radius:0}
.bar{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-size:17px;background:#21403b;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer}
button.main{background:var(--teal);color:#062421;font-weight:700}
.warn{background:#7a1512;color:#fff;border:2px solid #f06a64;border-radius:12px;padding:12px 18px;font-size:20px;font-weight:700}
.keys{font-size:13px;color:var(--sub);align-self:center;margin-left:auto}
</style>
</head>
<body>
<div class="warn" id="mismatch" hidden></div>
<div class="top">
  <div class="box"><div class="k">전체 경과 / 목표 합계</div><div class="v" id="total">0:00</div></div>
  <div class="box"><div class="k">이 장 경과 / 목표</div><div class="v" id="slideTime">0:00</div></div>
  <div class="box"><div class="k">계획 대비</div><div class="v" id="pace">—</div></div>
  <div class="box"><div class="k">본체</div><div class="v" id="hub" style="font-size:22px"><span class="hubdot"></span>무대 창 기다리는 중</div></div>
</div>
<div class="main">
  <div class="script">
    <div class="where" id="where"></div>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div class="hint" id="hint"></div>
  </div>
  <div class="side">
    <div class="next"><div class="k">다음 장</div><div class="t" id="nextTitle"></div></div>
    <ol id="list"></ol>
  </div>
</div>
<div class="bar">
  <button id="prev">이전</button>
  <button id="next" class="main">다음</button>
  <button id="timer">시간 시작</button>
  <button id="reset">시간 초기화</button>
  <button id="emer">대체 장면 켜기/끄기 (E)</button>
  <div class="keys">→ / PageDown / Space 다음 · ← / PageUp 이전 · E 대체 장면(전자레인지: 11/2 실측, 모은 기록: 11/3 스냅숏)</div>
</div>
<script src="slides.js"></script>
<script>
(function () {
  "use strict";
  const DATA = window.DECK_SLIDES;
  const $ = (id) => document.getElementById(id);
  const chan = new BroadcastChannel("simplelay-deck");
  const planTotal = DATA.filter((s) => !s.appendix).reduce((a, s) => a + s.target, 0);
  let cur = 0, emergency = false, lastState = 0;
  const captures = {};
  let t0 = null, slideT0 = Date.now(), running = false;

  const fmt = (sec) => { const s = Math.max(0, Math.round(Math.abs(sec))); return (sec < 0 ? "-" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const planUntil = (i) => DATA.slice(0, i).reduce((a, s) => a + s.target, 0);

  let apHeader = false;
  DATA.forEach((s, i) => {
    if (s.appendix && !apHeader) {
      apHeader = true;
      const h = document.createElement("li"); h.className = "sep"; h.textContent = "부록 (질의응답용)";
      $("list").append(h);
    }
    const li = document.createElement("li");
    li.dataset.i = i;
    const a = document.createElement("span"); a.textContent = (s.appendix ? "" : (i + 1) + ". ") + s.title.replace(/^부록 · /, "");
    const b = document.createElement("span"); b.textContent = s.appendix ? "" : fmt(s.target);
    li.append(a, b);
    li.addEventListener("click", () => chan.postMessage({ t: "goto", i }));
    $("list").append(li);
  });

  function render() {
    const s = DATA[cur] || DATA[0];
    $("where").textContent = s.act + " · " + (cur + 1) + " / " + DATA.length;
    $("title").textContent = s.title;
    // needsCapture 장은 그 캡처 파일이 있을 때만 캡처를 말하는 대본을 쓴다.
    const useCapture = !s.needsCapture || captures[s.needsCapture] === true;
    $("text").textContent = useCapture ? s.script : (s.scriptNoCapture || s.script);
    $("hint").textContent = s.id === "microwave"
      ? (emergency ? "무대에 11월 2일 실측 장면이 나오는 중 — '지금 값이 아니라 11월 2일 실측'이라고 말한다. E로 끈다."
                   : "실시간 전기 사용량이 안 보이면 E로 '11월 2일 실측' 장면을 띄우고 그렇게 말한다.")
      : s.id === "records" ? (emergency ? "무대에 11월 3일 스냅숏이 나오는 중 — E로 본체 실행 기록으로 돌아간다."
                   : "본체 연결 때는 본체 실행 기록(최근 200건)을 그린다. 11월 3일 실제 기록을 보이려면 E.")
      : s.id === "habit" ? (captures[s.needsCapture] ? "캡처 있음 — 무대 카드 위에 11월 5일 캡처가 뜬다."
                   : "캡처 없음(captures/habit-1105.png) — 무대에는 실제 기록 값만 보이고, 위 대본도 캡처 없는 판이다.")
      : s.appendix ? "부록 — 질의응답 때만. 목록에서 바로 고른다."
      : (s.live ? "이 장은 본체가 연결되면 실제 값을 보여 준다. 미연결이면 무대에 '미리보기'·'11월 3일 기준'이 붙는다." : "");
    $("nextTitle").textContent = DATA[cur + 1] ? DATA[cur + 1].title : "(마지막 장)";
    [...$("list").children].forEach((li) => li.classList.toggle("cur", li.dataset.i === String(cur)));
  }

  function tick() {
    const now = Date.now();
    const total = running && t0 ? (now - t0) / 1000 : 0;
    $("total").textContent = fmt(total) + " / " + fmt(planTotal);
    $("total").className = "v" + (total > 600 ? " over" : "");
    const st = (now - slideT0) / 1000, tg = (DATA[cur] || DATA[0]).target;
    const ap = !!(DATA[cur] && DATA[cur].appendix);
    $("slideTime").textContent = ap ? fmt(st) + " / 부록" : fmt(st) + " / " + fmt(tg);
    $("slideTime").className = "v " + (!ap && st > tg ? "over" : "ok");
    if (running) {
      const diff = total - (planUntil(cur) + Math.min(st, tg));
      $("pace").textContent = (diff > 0 ? "+" : "") + Math.round(diff) + "초";
      $("pace").className = "v " + (diff > 15 ? "over" : "ok");
    } else { $("pace").textContent = "—"; $("pace").className = "v"; }
    const hubEl = $("hub");
    if (Date.now() - lastState > 9000) hubEl.innerHTML = '<span class="hubdot"></span>무대 창 응답 없음';
  }

  chan.onmessage = (ev) => {
    const m = ev.data || {};
    if (m.t !== "state") return;
    const first = lastState === 0;
    lastState = Date.now();
    if (m.i !== cur) {
      slideT0 = Date.now();
      // 창을 처음 열 때 받은 현재 장은 '넘김'이 아니다 — 그때는 시간을 시작하지 않는다.
      if (!running && !first && m.i > 0) startTimer();
    }
    cur = m.i; emergency = !!m.emergency;
    const mm = $("mismatch");
    mm.hidden = !m.mismatch;
    mm.textContent = m.mismatch ? "장 목록 불일치 — " + m.mismatch + ". 대본이 다른 장을 가리킬 수 있습니다. index.html과 slides.js를 맞춰 주세요." : "";
    const h = m.hub || {};
    $("hub").innerHTML = '<span class="hubdot' + (h.connected ? " on" : "") + '"></span>' +
      (h.connected ? "연결됨" + (h.version ? " · " + String(h.version).replace(/[<>&]/g, "") : "") : "미연결 · 무대는 미리보기");
    render();
  };

  function startTimer() { running = true; t0 = Date.now(); $("timer").textContent = "시간 진행 중"; }
  $("timer").onclick = () => { if (!running) { startTimer(); slideT0 = Date.now(); } };
  $("reset").onclick = () => { running = false; t0 = null; slideT0 = Date.now(); $("timer").textContent = "시간 시작"; };
  $("prev").onclick = () => chan.postMessage({ t: "nav", dir: -1 });
  $("next").onclick = () => chan.postMessage({ t: "nav", dir: 1 });
  $("emer").onclick = () => chan.postMessage({ t: "emergency" });
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const k = e.key;
    if (k === "ArrowRight" || k === "PageDown" || k === " " || k === "Spacebar") { e.preventDefault(); chan.postMessage({ t: "nav", dir: 1 }); }
    else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); chan.postMessage({ t: "nav", dir: -1 }); }
    else if (k === "e" || k === "E") chan.postMessage({ t: "emergency" });
  });

  // 캡처 파일이 실제로 있는지 확인(없으면 캡처를 말하지 않는 대본).

  DATA.filter((d) => d.needsCapture).forEach((d) => {
    captures[d.needsCapture] = false;
    fetch(d.needsCapture, { method: "GET", cache: "no-store" })
      .then((r) => { captures[d.needsCapture] = r.ok && (r.headers.get("Content-Type") || "").startsWith("image/"); render(); })
      .catch(() => {});
  });
  render();
  chan.postMessage({ t: "hello" });
  setInterval(tick, 250);
  tick();
})();
</script>
</body>
</html>
